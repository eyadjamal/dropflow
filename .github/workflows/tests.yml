name: tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth fonts-dejavu-core libxcursor1 ffmpeg tesseract-ocr
      - run: python -m pip install -r requirements.txt
      - name: Optional X11 shortcut
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements-x11.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Linux GUI and conversion checks
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24' python DropFlow.pyw --selftest --console
          xvfb-run -a -s '-screen 0 1280x1024x24' python tests/gui_smoke.py
          DROPFLOW_TEST_NO_DND=1 xvfb-run -a -s '-screen 0 1280x1024x24' python tests/gui_smoke.py
      - name: Windows GUI and conversion checks
        if: runner.os == 'Windows'
        run: |
          python DropFlow.pyw --selftest --console
          python tests/gui_smoke.py
