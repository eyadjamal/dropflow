name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pystray tkinterdnd2 "Pillow<10.1" PyMuPDF python-docx reportlab python-pptx openpyxl pytesseract arabic-reshaper python-bidi
      - name: Compile
        run: |
          python -m py_compile DropFlow.pyw media_converter.py office_converter.py i18n.py app_update.py appearance.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
